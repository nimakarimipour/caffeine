buildscript {
  repositories {
    jcenter()
  }

  dependencies {
    classpath 'com.github.ben-manes:gradle-versions-plugin:0.6'
  }
}

plugins {
  // we assume you are already using the Java plugin
  id "net.ltgt.errorprone" version "2.0.2"
}

apply plugin: 'com.github.ben-manes.versions'
apply plugin: 'java'

group = 'com.github.ben-manes'
sourceCompatibility = '1.8'

repositories {
  mavenLocal()
  mavenCentral()
}

dependencies {
  def guava = '18.0'

  // TODO(ben): remove compile-time dependency
  implementation "com.google.guava:guava:${guava}"

  // compile time (annotations only)
  implementation 'com.google.code.findbugs:jsr305:2.0.1'

  // unit testing
  testImplementation 'org.mockito:mockito-core:1.10.8'
  testImplementation 'org.assertj:assertj-core:1.7.0'
  testImplementation 'org.assertj:assertj-guava:1.3.0'
  testImplementation 'com.jayway.awaitility:awaitility:1.6.3'
  testImplementation dependencies.create('org.testng:testng:6.8.8') {
    exclude group: 'junit'
  }
  testImplementation dependencies.create("com.google.guava:guava-testlib:${guava}") {
    exclude group: 'junit'
  }

  // benchmarking
  testImplementation 'org.openjdk.jmh:jmh-core:1.3.4'
  testImplementation 'com.googlecode.concurrentlinkedhashmap:concurrentlinkedhashmap-lru:1.4'

  errorproneJavac "com.google.errorprone:javac:9+181-r4173-1"
  errorprone "com.google.errorprone:error_prone_core:2.29.2"
  annotationProcessor "com.uber.nullaway:nullaway:0.10.20"
  annotationProcessor "edu.ucr.cs.riple.annotator:annotator-scanner:1.3.13-java-8-SNAPSHOT"
}

test {
  useTestNG()
}


def scanner_config = "${rootProject.projectDir}/annotator-out/scanner.xml"
def nullaway_config = "${rootProject.projectDir}/annotator-out/checker.xml"

import net.ltgt.gradle.errorprone.CheckSeverity
tasks.withType(JavaCompile) {
    if (!name.toLowerCase().contains("test")) {
        println(scanner_config)
        println(nullaway_config)
        options.errorprone {
            check("NullAway", CheckSeverity.ERROR)
            check("AnnotatorScanner", CheckSeverity.ERROR)
            option("NullAway:AnnotatedPackages", "com.github.benmanes.caffeine")
            option("NullAway:SerializeFixMetadata", "true")
            option("NullAway:FixSerializationConfigPath", nullaway_config)
            option("AnnotatorScanner:ConfigPath", scanner_config)
        }
  }
}
